name: deploy
on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  schedule:
    - cron: '0 6 * * *' # refresh GitHub commit stats daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v4
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.2'
        bundler-cache: true
    - name: Update _config.yml ⚙️
      uses: fjogeleit/yaml-update-action@main
      with:
        commitChange: false
        valueFile: '_config.yml'
        propertyPath: 'giscus.repo'
        value: ${{ github.repository }}
    - name: Fetch GitHub commit stats 📊
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        GH_USER=$(ruby -ryaml -e "puts YAML.load_file('_config.yml')['github_username']")
        RESPONSE=$(curl -s -H "Authorization: bearer $GITHUB_TOKEN" -H "Content-Type: application/json" \
          -d "{\"query\":\"query(\$login: String!) { user(login: \$login) { contributionsCollection { totalCommitContributions contributionCalendar { totalContributions } } } }\", \"variables\": {\"login\": \"$GH_USER\"}}" \
          https://api.github.com/graphql)
        COMMITS=$(echo "$RESPONSE" | jq -r '.data.user.contributionsCollection.totalCommitContributions')
        CONTRIBUTIONS=$(echo "$RESPONSE" | jq -r '.data.user.contributionsCollection.contributionCalendar.totalContributions')
        if [ "$COMMITS" != "null" ] && [ -n "$COMMITS" ]; then
          mkdir -p _data
          {
            printf 'commits_last_year: %s\n' "$COMMITS"
            printf 'contributions_last_year: %s\n' "$CONTRIBUTIONS"
            printf 'generated_at: "%s"\n' "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } > _data/github_stats.yml
        else
          echo "GitHub GraphQL query failed, keeping existing _data/github_stats.yml"
          echo "$RESPONSE"
        fi
    - name: Install and Build 🔧
      run: |
        npm install -g mermaid.cli
        npm install -g purgecss
        export JEKYLL_ENV=production
        bundle exec jekyll build --lsi
        purgecss -c purgecss.config.js
    - name: Deploy 🚀
      if: github.event_name != 'pull_request'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: _site
